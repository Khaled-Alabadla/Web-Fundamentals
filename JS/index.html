<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change and Input</title>
</head>

<body>
  <p>My name is: <span></span></p>
  <p>My language is: <span class="language-value"></span></p>
  <input type="text" name="name" oninput="setName(this)">
  <select name="language" id="" onchange="setLang(this)">
    <option value="">Choose Option</option>
    <option value="ar">Arabic</option>
    <option value="en">English</option>
    <option value="fr">French</option>
  </select>

  <script>
    function setName(ele) {
      document.querySelector('span').innerText = ele.value
    }

    function setLang(elem) {
      let span = document.querySelector('.language-value')
      span.innerText = elem.querySelector('option[value=' + elem.value + ']').innerText
    }
    console.log(input)
  </script>
</body>

</html>
