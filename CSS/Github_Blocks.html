<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Github Blocks</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: cursive;
    }

    .container {
      width: 800px;
      margin: 50px auto;
      padding: 30px;
      background-color: #e6e6e6;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #1d3a70;
    }

    img {
      width: 200px;
    }

    .section {
      display: flex;
      padding: 30px;
      margin-bottom: 20px;
    }


    .first-section {
      background-color: #4db9e2;
      justify-content: space-between;
    }

    .second-section {
      background-color: #b38faf;
      justify-content: space-evenly;
    }

    .third-section {
      background-color: #fff;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Github Blocks</h1>
    <div class="blocks">
      <div class="section first-section">
        <img src="https://octodex.github.com/images/securityknightocat.png" alt="Security Knigh Tocat">
        <img src="https://octodex.github.com/images/universetocat.png" alt="Universe Tocat">
        <img src="https://octodex.github.com/images/Parentocats_FULL.png" alt="">
      </div>
      <div class="section second-section">
        <img src="https://octodex.github.com/images/yogitocat.png" alt="Yogitocat">
        <img src="https://octodex.github.com/images/Sentrytocat_octodex.jpg" alt="Sentrytocat Octodex">
      </div>
      <div class="section third-section">
        <img src="https://octodex.github.com/images/puddle_jumper_octodex.jpg" alt="Puddle Jumper Octodex">
        <img src="https://octodex.github.com/images/filmtocat.png" alt="Filmtocat">
        <img src="https://octodex.github.com/images/minertocat.png" alt="Minertocat">
      </div>
    </div>
  </div>
</body>

</html>
