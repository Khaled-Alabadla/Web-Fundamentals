<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Card</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: cursive;
      width: 100vw
    }

    .container {
      width: 70%;
      margin: 40px auto;
      border: 3px solid #ddd
    }

    .top {
      background-color: #45a4bb;
      height: 100px;
    }

    .content {
      padding: 30px;
      position: relative;
    }

    .content h1 {
      margin-top: 25px;
    }

    .content .user {
      position: absolute;
      top: -50px;
      left: 30px;
      width: 100px;
      border: 4px solid #ddd;
      height: 100px;
      border-radius: 50%;
    }

    .location {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .location .maker {
      width: 12px;
    }

    .position {
      margin-top: 12px;
    }

    .edit-profile {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 15px;
    }

    .edit-profile img {
      width: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top"></div>
    <div class="content">
      <img src="icons/user-circle.png" class="user" alt="User icon">
      <h1>Khaled Esam</h1>
      <div class="location">
        <img src="icons/map-marker.png" alt="Map maker" class="maker">
        <p>Gaza</p>
      </div>
      <div class="position">
        Software Engineer | Full-Stack Developer | PHP & Laravel Developer
      </div>
      <div class="edit-profile">
        <img src="icons/gear.png" alt="Edit profile">
        <a href="">edit profile</a>
      </div>
    </div>
  </div>
</body>

</html>
