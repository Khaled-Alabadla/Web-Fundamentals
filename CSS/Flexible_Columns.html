<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexible Columns</title>
  <style>
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff
    }

    .container {
      width: 90vw;
      margin: 30px auto;
    }

    .row {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .row div {
      padding: 10px;
      background-color: cadetblue;
    }

    .row .col {
      flex-grow: 1;
    }

    .row .col-2 {
      flex-grow: 2;
    }

    .row .col-3 {
      flex-grow: 3;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col">1/4</div>
      <div class="col">1/4</div>
      <div class="col">1/4</div>
      <div class="col">1/4</div>
    </div>
    <div class="row">
      <div class="col">1/3</div>
      <div class="col-2">2/3</div>
    </div>
    <div class="row">
      <div class="col-2">2/5</div>
      <div class="col-3">3/5</div>
    </div>
  </div>
</body>

</html>
