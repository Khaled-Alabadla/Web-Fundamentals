<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styling</title>
  <style>
    body {
      font-family: cursive;
    }

    h1,
    h2,
    h3 {
      padding: 10px;
      margin: 10px;
    }

    h1 {
      background-color: #000;
      color: #fff;
    }

    h1 span {
      color: aqua;
    }

    h2 {
      background-color: rgb(80, 8, 148);
      text-align: center;
      font-style: italic;
      color: #fff;
    }

    h3 {
      background-color: rgb(131, 191, 236);
      text-decoration: underline;
      text-align: right;
    }
  </style>
</head>

<body>
  <h1>My<span>Cloud</span></h1>
  <h2>Completed Projects:</h2>
  <h3>Contact Us</h3>
</body>

</html>
